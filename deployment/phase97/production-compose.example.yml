# REVIEW FIRST. Production environment, assets, release hash and external DB must be configured.
# Does not provision PostgreSQL; use an independently backed-up private database.
services:
  riseora-api:
    build:
      context: ../..
      dockerfile: deployment/phase97/Dockerfile.example
    restart: unless-stopped
    init: true
    env_file:
      - ../../server/.env.production
    environment:
      NODE_ENV: production
      PORT: '5000'
    ports:
      - '127.0.0.1:5000:5000'
    volumes:
      - riseora_live_uploads:/app/server/uploads
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:5000/api/system/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 8s
      start_period: 40s
      retries: 3
volumes:
  riseora_live_uploads:
