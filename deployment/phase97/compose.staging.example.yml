# TEMPLATE, NOT A READY-TO-RUN LIVE DEPLOYMENT.
# Run from a trusted full repo checkout: docker compose -f deployment/phase97/compose.staging.example.yml config
# Uses external isolated PostgreSQL; do not reuse the development or production database for staging.
services:
  riseora-api:
    build:
      context: ../..
      dockerfile: deployment/phase97/Dockerfile.example
    restart: unless-stopped
    init: true
    env_file:
      - ../../server/.env.staging
    environment:
      NODE_ENV: production
      PORT: '5000'
    ports:
      - '127.0.0.1:5000:5000'
    volumes:
      - riseora_staging_uploads:/app/server/uploads
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:5000/api/system/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 8s
      start_period: 40s
      retries: 3
volumes:
  riseora_staging_uploads:
