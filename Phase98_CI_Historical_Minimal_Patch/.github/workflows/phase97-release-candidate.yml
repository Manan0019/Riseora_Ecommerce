name: Phase 97 Production Candidate Verification
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  candidate-verify:
    runs-on: ubuntu-latest
    # Schema generation requires a syntactically valid URL but NEVER connects here.
    # This is a non-production placeholder; do not use live/staging DB credentials in CI.
    env:
      DATABASE_URL: postgresql://riseora_ci@127.0.0.1:5432/riseora_ci_schema_only
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run candidate:tests
      - run: npm run candidate:doctor
      - run: npm run candidate:layout
      - run: npm run candidate:migrations
      - run: npm run launch:tests
      - run: npm run security:audit
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm run build
      - run: npm run candidate:bundle
      - run: npm run performance:budget
      # Production environment, gateway live credentials, backup, migration and release approval
      # are intentionally NEVER run by pull-request CI.
